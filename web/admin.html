<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordle 竞赛 · 管理面板</title>
<link rel="stylesheet" href="/base.css">
<style>
  body { padding: 16px; font-size: 15px; line-height: 1.5; }
  h1 { font-size: 18px; margin: 0 0 12px; letter-spacing: .04em; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .stats { display: flex; flex-wrap: wrap; gap: 22px; }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border);
           background: var(--control); color: inherit; cursor: pointer; }
  button:hover:enabled { background: var(--gray); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--green); border-color: var(--green); color: var(--text); font-weight: 600; }
  button.danger  { background: #8d4e4e; border-color: #8d4e4e; color: var(--text); }
  input[type=password], input[type=number] { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
          background: var(--bg); color: inherit; min-width: 180px; }
  input[type=number] { min-width: 0; width: 90px; }
  input[type=number]:disabled { opacity: .45; }
  label { cursor: pointer; }
  .modes { display: flex; flex-wrap: wrap; gap: 18px; }
  .modes label { display: flex; align-items: center; gap: 6px; }
  .modes em { color: var(--muted); font-style: normal; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.top1 td { color: var(--yellow); font-weight: 600; }
  #msg { color: #e0a0a0; min-height: 22px; font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .waiting { background: var(--muted); } .open { background: var(--green); } .closed { background: var(--yellow); }
</style>
</head>
<body>
<h1>Wordle 竞赛 · 管理面板</h1>

<div class="card" id="loginCard">
  <div class="row">
    <input id="pw" type="password" placeholder="管理口令" autocomplete="current-password">
    <button class="primary" id="loginBtn">登录</button>
  </div>
</div>

<div id="msg" role="status"></div>

<div id="panel" hidden>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <b>开赛</b>
      <span class="muted">这一页就是大屏：投屏打开 /admin，下面的实时榜单每 2s 刷新</span>
    </div>
    <div class="modes">
      <label><input type="radio" name="mode" value="round" checked> 轮次赛
        <em>一轮一题，解出即收工，按步数 / 用时排名</em></label>
      <label><input type="radio" name="mode" value="timed"> 限时赛
        <em>限时内答对一题立刻换下一题继续答，按答对题数排名</em></label>
    </div>
    <div class="row" style="margin-top:12px">
      <label for="mins">时长</label>
      <input id="mins" type="number" min="0.5" max="360" step="0.5" value="10" disabled>
      <span class="muted">分钟（限时赛用，0.5 ~ 360；时间到自动收场）</span>
      <span style="flex:1"></span>
      <button class="danger" id="closeBtn">结束本场</button>
      <button class="primary" id="openBtn">开赛</button>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><b id="roundNo">—</b><span>场次号</span></div>
      <div class="stat"><b id="mode">—</b><span>玩法</span></div>
      <div class="stat"><b id="roundAt">—</b><span>开赛时间</span></div>
      <div class="stat"><b id="state">—</b><span>状态</span></div>
      <div class="stat"><b id="left">—</b><span>剩余时间</span></div>
      <div class="stat"><b id="playing">0</b><span>作答中</span></div>
      <div class="stat"><b id="solved">0</b><span>已答对人数</span></div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <b id="boardTitle">实时榜单</b><span class="muted" id="tick"></span>
    </div>
    <table>
      <thead id="boardHead"><tr><th>名次</th><th>昵称</th><th>步数</th><th>用时</th></tr></thead>
      <tbody id="board"><tr><td colspan="4" class="muted">还没有人解出</td></tr></tbody>
    </table>
  </div>
</div>

<script src="/common.js"></script>
<script>
"use strict";
const { fmtLeft, modeName, boardHead, boardCells, boardEmpty } = WordleUI;
let token = "";           // 只在内存，刷新即失效，重新登录即可
let timer = null;
let round = { roundNo: -1, state: "waiting", mode: "round", endsAt: 0 };
let offset = 0; // 服务端时钟 - 本地时钟
const $ = id => document.getElementById(id);

const fmtTime = ms => new Date(ms).toLocaleString("zh-CN", { hour12: false });

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "X-Admin-Token": token }
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const error = new Error(body.error || ("HTTP " + res.status));
    error.status = res.status;
    throw error;
  }
  return body;
}

$("loginBtn").onclick = async () => {
  if ($("loginBtn").disabled) return;
  $("loginBtn").disabled = true;
  clearInterval(timer);
  timer = null;
  $("msg").textContent = "";
  try {
    const r = await api("/api/v1/admin/login", { method: "POST", body: JSON.stringify({ password: $("pw").value }) });
    token = r.token;
    $("pw").value = "";
    $("loginCard").hidden = true;
    $("panel").hidden = false;
    await refresh();
    if (token) timer = setInterval(refresh, 2000);   // 每 2s 拉一次
  } catch (e) {
    $("msg").textContent = "登录失败：" + e.message;
  } finally {
    $("loginBtn").disabled = false;
  }
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });

// 只有限时赛才需要时长；切玩法时同步输入框可用状态。
for (const radio of document.querySelectorAll('input[name="mode"]')) {
  radio.addEventListener("change", () => { $("mins").disabled = selectedMode() !== "timed"; });
}
const selectedMode = () => document.querySelector('input[name="mode"]:checked').value;

$("openBtn").onclick = async () => {
  const m = selectedMode();
  const mins = Number($("mins").value);
  if (m === "timed" && (!Number.isFinite(mins) || mins < 0.5 || mins > 360)) {
    $("msg").textContent = "限时赛时长需在 0.5 ~ 360 分钟之间";
    return;
  }
  const tip = m === "timed"
    ? `开启限时赛：${mins} 分钟，答对一题立刻换下一题，时间到自动收场。上一场进度作废。`
    : "开启轮次赛？上一场进度作废，前端会在 3s 内清盘。";
  if (!confirm(tip)) return;
  await action("/api/v1/admin/round/open", m === "timed"
    ? { mode: m, durationSec: Math.round(mins * 60) }
    : { mode: m });
};
$("closeBtn").onclick = async () => {
  if (!confirm("结束本场？之后到达的猜测一律 409 expired。")) return;
  await action("/api/v1/admin/round/close", {});
};

async function action(path, body) {
  $("msg").textContent = "";
  try { await api(path, { method: "POST", body: JSON.stringify(body) }); await refresh(); }
  catch (e) { $("msg").textContent = "操作失败：" + e.message; }
}

// 剩余时间按本地时钟走，不用等服务端刷新周期。
function renderLeft() {
  $("left").textContent = round.mode !== "timed" ? "—"
    : round.state === "closed" ? "已结束"
    : fmtLeft(round.endsAt - (Date.now() + offset));
}

function renderBoard(rows) {
  $("boardTitle").textContent = round.mode === "timed" ? "实时排行（按答对题数）" : "实时榜单（按步数 / 用时）";
  $("boardHead").innerHTML = boardHead(round.mode);
  $("board").innerHTML = rows.length
    ? rows.map(entry => `<tr class="${entry.rank === 1 ? "top1" : ""}">${boardCells(entry, round.mode)}</tr>`).join("")
    : boardEmpty(round.mode);
}

async function refresh() {
  let st;
  try { st = await api("/api/v1/admin/state"); }
  catch (e) {
    // 令牌失效（比如服务重启）就退回登录
    $("msg").textContent = "拉取状态失败：" + e.message;
    if (e.status === 401) { clearInterval(timer); timer = null; token = ""; $("panel").hidden = true; $("loginCard").hidden = false; }
    return;
  }
  const r = st.round;
  const changed = r.roundNo !== round.roundNo;
  round = r;
  // 只在切换场次时同步表单，避免轮询覆盖管理员正在编辑的玩法与时长。
  if (changed) {
    document.querySelectorAll('input[name="mode"]').forEach(el => { el.checked = el.value === r.mode; });
    $("mins").disabled = r.mode !== "timed";
    if (r.mode === "timed") $("mins").value = r.durationMs / 60000;
  }
  offset = r.serverNow - Date.now();

  $("roundNo").textContent = r.roundNo || "—";
  $("mode").textContent = modeName(r.mode);
  $("roundAt").textContent = r.openedAt ? fmtTime(r.openedAt) : "—";
  $("state").innerHTML = '<span class="dot ' + r.state + '"></span>' + r.state;
  $("playing").textContent = r.playing;
  $("solved").textContent = r.solved;
  $("openBtn").disabled = r.state === "open";
  $("closeBtn").disabled = r.state !== "open";
  $("tick").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
  renderLeft();
  renderBoard(st.board);
}

setInterval(renderLeft, 500);
</script>
</body>
</html>
